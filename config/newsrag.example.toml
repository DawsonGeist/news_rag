# Copy to config/newsrag.toml (gitignored) and edit, or point $NEWSRAG_CONFIG at a file.
# Every key is optional; defaults are in src/newsrag/config.py.
# $NEWSRAG_DATA_DIR overrides data_dir. Keep it on a local disk, never a network mount.

data_dir = "~/newsrag-data"
# user_agent = "newsrag/0.1"
contact_email = "dawsonnewsrag@gmail.com"   # sent as the HTTP From header

[fetch]
global_concurrency = 64
default_crawl_delay_s = 5.0
max_crawl_delay_s = 60.0
request_timeout_s = 30.0
max_body_bytes = 5000000
max_attempts = 5
lease_s = 300
claim_batch = 200
max_redirects = 5
robots_ttl_s = 86400
retry_base_s = 60.0
max_retry_after_s = 21600
reservation_slack_s = 30.0

[poll]
min_interval_s = 300
default_interval_s = 1800
max_interval_s = 21600
pause_after_failures = 10
concurrency = 16

[writer]
flush_rows = 500
flush_seconds = 60.0
# extract_workers = 8        # default: min(8, CPU count - 4)
extract_timeout_s = 120.0
extract_max_attempts = 3
compact_interval_s = 3600.0
compact_target_mb = 128

[vet]
concurrency = 64
feed_attempts = 3
samples_per_feed = 3
samples_per_source = 5
stale_days = 30
reject_paywall_ratio = 0.5
reject_english_ratio = 0.5
review_full_text_ratio = 0.67
review_date_ratio = 0.5
review_median_words = 150

[retention]
raw_days = 60
stage_event_days = 30
poll_log_days = 14
