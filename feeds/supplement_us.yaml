# Hand-curated US outlets that are missing from (or under-covered in) the source list.
#
# Same shape as feeds/source/feeds_world.yaml. URLs were written from memory and are
# UNVERIFIED: the feed vetter decides what is reachable, open-access and fresh.
# Known-paywalled outlets are included on purpose as negative test cases for the
# paywall detector; expect them to be rejected.
#
# Not included because they publish no public RSS: AP News, Reuters.
#
# Categories must match the source list's names:
#   'Politics & Society', 'World / International', 'Business & Economy', Opinion,
#   'Science & Technology', 'Local News', 'Lifestyle & Culture', Sports

'United States':
  cnn.com:
    name: CNN
    languages: [en]
    notes: rss.cnn.com feeds are known to update irregularly.
    feeds:
      'Politics & Society':
        - 'http://rss.cnn.com/rss/cnn_allpolitics.rss'
      'World / International':
        - 'http://rss.cnn.com/rss/cnn_topstories.rss'
        - 'http://rss.cnn.com/rss/cnn_world.rss'
      'Business & Economy':
        - 'http://rss.cnn.com/rss/money_latest.rss'
  nbcnews.com:
